name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: shellcheck
        run: shellcheck scripts/install.sh
      - name: python compiles
        run: python -m py_compile scripts/bench.py scripts/model.py
      - name: unit-economics model runs
        run: python scripts/model.py
