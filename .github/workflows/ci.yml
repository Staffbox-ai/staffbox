name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest  # the target is a Mac mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.sh parses (zsh)
        run: zsh -n scripts/install.sh
      - name: python compiles
        run: python -m py_compile scripts/bench.py staffbox/*.py
      - name: unit tests (no model needed)
        run: python -m unittest discover -s tests -v
      - name: example brain is healthy
        run: bin/staffbox check examples/peachtree-cabinet-works/vault
      - name: template brain is healthy
        run: bin/staffbox check profile/vault
      - name: test set is reproducible
        run: python examples/peachtree-cabinet-works/make_tests.py | diff - examples/peachtree-cabinet-works/tests.jsonl
      - name: Fieldstone tests match their generator
        run: python examples/fieldstone-it/make_tests.py | diff - examples/fieldstone-it/tests.jsonl
      - name: Fieldstone brain is healthy
        run: bin/staffbox check examples/fieldstone-it/vault
