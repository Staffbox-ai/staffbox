name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest  # the target is a Mac mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.sh parses (zsh)
        run: zsh -n scripts/install.sh
      - name: python compiles
        run: python -m py_compile scripts/bench.py
